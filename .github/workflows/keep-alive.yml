name: keep-alive

# A free Supabase project with no activity for 7 days is paused (P8 plan, "The first production release"). Every three
# days this asks production's /api/ready, which reads the database through the API, so the project never sits idle.
# A failed run also means production was not ready: GitHub emails whoever last edited this schedule.
# Remove once production is on a paid Supabase plan or has daily traffic of its own.
on:
  schedule:
    - cron: '23 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask production whether it is ready
        env:
          PUBLIC_URL: ${{ vars.PRODUCTION_URL || 'https://khanha.in' }}
        run: curl -fsS --retry 3 --retry-all-errors --max-time 20 "$PUBLIC_URL/api/ready"
