name: infra

# Plans production's Terraform on a pull request, and applies it from main (production) after the
# user's approval. Nothing here
# runs until the bootstrap has been applied and its outputs are in GitHub (infra/README.md); until then the jobs skip.
on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  # Weekly drift check: a plan against main's code that finds a difference fails the run (the Plan step).
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

# One run at a time against production's state. `queue: max` lets every pending run wait: by default a newer pending
# run replaces the older one, so a pull request's plan could silently drop a main push's apply.
concurrency:
  group: infra-production
  queue: max
  cancel-in-progress: false

# `shell: bash` makes GitHub run `bash -eo pipefail`, so a failed `terraform plan | tee` fails the step.
defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'
  TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan:
    # A fork's pull request never gets the role: its code would run with the account's read access.
    if: >-
      vars.TF_STATE_BUCKET != '' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: infra-plan
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/envs/production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"
      # The repository is public, so the plan is too: Terraform never holds a secret value (plan, "Cross-cutting
      # decisions"). No plan file is uploaded; apply plans again after the approval.
      - name: Plan
        run: |
          # A scheduled run asks for -detailed-exitcode (0 no changes, 1 error, 2 changes); on a pull request or a
          # push a plan with changes is normal, so the flag stays off there.
          detailed=''
          [ "$GITHUB_EVENT_NAME" = schedule ] && detailed='-detailed-exitcode'
          # Under pipefail the pipe's status would hide exit code 2 behind tee, so read terraform's own.
          set +e
          terraform plan -no-color -lock-timeout=5m $detailed | tee "$RUNNER_TEMP/plan.txt"
          code=${PIPESTATUS[0]}
          set -e
          { echo '### Terraform plan (production)'; echo '```'; cat "$RUNNER_TEMP/plan.txt"; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = 2 ]; then
            echo '::error::The applied infrastructure has drifted from main, or an apply is waiting (see the plan above).'
          fi
          exit "$code"

  apply:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Required reviewer: the user. The approval is given after reading the plan job's summary.
    environment: production-infra
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/envs/production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - run: terraform init -backend-config="bucket=$TF_STATE_BUCKET"
      - run: terraform apply -auto-approve -no-color -lock-timeout=5m
