name: ci

# The one required check is `ci-ok`. No `paths:` filters: a path-filtered required check leaves unrelated PRs stuck
# at "Expected".
on:
  pull_request:
    branches: [dev, main]
    # labeled/unlabeled: adding `no-release` re-runs version-intent.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:staging
      - run: node ../scripts/ci/check-bundle.mjs .

  server-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      # --ignore-scripts skips the Supabase CLI binary download; nothing here needs it.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Only the services the API and tests use: Postgres, GoTrue, PostgREST and Kong.
      - run: npm run db:start:ci
      # server/.env.example holds the local CLI's default keys and URL, so the test-target guard sees APP_ENV=local.
      - run: cp .env.example .env
      - run: npm run seed
      - run: npm test
      - name: Generated types match the migrations
        run: npm run db:types && git diff --exit-code -- src/types/database.ts
      - if: always()
        run: npm run db:stop

  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/ci/check-migrations.mjs --base origin/${{ github.base_ref }} --main origin/main

  version-intent:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # Release tags are needed for the release-PR check.
      - run: git fetch --tags --quiet
      - name: Check the change intent
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          NO_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'no-release') }}
        run: |
          args=(--base "origin/$BASE_REF" --base-branch "$BASE_REF" --head-branch "$HEAD_REF")
          if [ "$NO_RELEASE" = true ]; then args+=(--allow-missing); fi
          node scripts/version/check.mjs "${args[@]}"

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: |
          for f in server/Dockerfile client/Dockerfile; do
            docker run --rm -i hadolint/hadolint < "$f"
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          load: true
          tags: fp-api:ci
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: client
          push: false
          load: true
          tags: fp-web:ci
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      # /api/health never touches the database, so dummy Supabase values are enough.
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 -e APP_ENV=local -e SUPABASE_URL=http://127.0.0.1:1 \
            -e SUPABASE_SECRET_KEY=sb_secret_ci fp-api:ci
          docker run -d --name web -p 8080:8080 -e API_UPSTREAM=http://127.0.0.1:1 \
            -e SUPABASE_URL=https://ci.supabase.co -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci fp-web:ci
          for url in localhost:8000/api/health localhost:8080/healthz localhost:8080/runtime-env.js; do
            for _ in $(seq 1 20); do curl -fs -o /dev/null "$url" && break; sleep 1; done
            curl -fsS -o /dev/null -w "$url %{http_code}\n" "$url"
          done
          curl -fsS localhost:8000/api/health | grep -q '"commit":"${{ github.sha }}"'
      - name: Image sizes
        run: |
          check() {
            size=$(docker image inspect --format '{{.Size}}' "$1")
            echo "$1: $((size / 1000000)) MB (budget $2 MB)"
            [ "$size" -le $(($2 * 1000000)) ]
          }
          check fp-web:ci 50
          check fp-api:ci 200

  ci-ok:
    if: always()
    needs: [client, server-static, server-tests, migrations, version-intent, repo, images]
    runs-on: ubuntu-latest
    steps:
      # Skipped jobs (PR-only jobs on a push) count as success.
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = failure ] || [ "$r" = cancelled ]; then exit 1; fi
          done
