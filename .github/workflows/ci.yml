name: ci

# The one required check is `ci-ok`. No `paths:` filters: a path-filtered required check leaves unrelated PRs stuck
# at "Expected".
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build:staging
      - run: node ../scripts/ci/check-bundle.mjs .

  server-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      # --ignore-scripts skips the Supabase CLI binary download; nothing here needs it.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Only the services the API and tests use: Postgres, GoTrue, PostgREST and Kong.
      - run: npm run db:start:ci
      # server/.env.example holds the local CLI's default keys and URL, so the test-target guard sees APP_ENV=local.
      - run: cp .env.example .env
      - run: npm run seed
      - run: npm test
      - name: Generated types match the migrations
        run: npm run db:types && git diff --exit-code -- src/types/database.ts
      - if: always()
        run: npm run db:stop

  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/ci/check-migrations.mjs --base origin/${{ github.base_ref }} --main origin/main

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  ci-ok:
    if: always()
    needs: [client, server-static, server-tests, migrations, repo]
    runs-on: ubuntu-latest
    steps:
      # Skipped jobs (PR-only jobs on a push) count as success.
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = failure ] || [ "$r" = cancelled ]; then exit 1; fi
          done
