name: security

# Informational: a new advisory in a dependency should not block unrelated PRs. On PRs it runs only when dependencies
# change (the PR's own commits are scanned for secrets by ci.yml's repo job); the full audit and the full-history
# secret scan run weekly (GitHub Free minutes, ADR-011).
on:
  pull_request:
    branches: [dev, main]
    paths:
      [
        '**/package.json',
        '**/package-lock.json',
        '.gitleaks.toml',
        '.github/workflows/security.yml',
      ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [client, server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # Only what ships: dev tooling advisories do not reach users.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The binary, not gitleaks-action: the action needs a paid licence on organisation repositories.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose'
