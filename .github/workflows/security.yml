name: security

# Known vulnerabilities, in what we depend on and what we ship. A new advisory in an unchanged dependency should not
# block unrelated PRs, so on a PR this runs only when dependencies, the images or the install settings change; the full
# set runs weekly, and Dependabot raises the alert in between. Static analysis runs on every change, in ci.yml.
on:
  pull_request:
    branches: [dev, main, feat/P1]
    paths:
      [
        '**/package.json',
        '**/package-lock.json',
        '**/.npmrc',
        '**/Dockerfile',
        'client/nginx/**',
        '.gitleaks.toml',
        '.github/workflows/security.yml',
      ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [., client, server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      # Every dependency, dev tooling included: a compromised build or test tool reaches the bundle and CI's secrets.
      - run: npm audit --audit-level=moderate

  # The images as they would ship, OS packages and Node modules alike. --ignore-unfixed: a CVE with no fix yet cannot be
  # acted on, and the Dockerfiles take Alpine's fixes at build time (apk upgrade).
  images:
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: 0.76.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The binary from its release, checked against the release's checksums, not trivy-action: an action's tag can be
      # repointed (trivy-action's was, in a supply-chain attack).
      - name: Install Trivy
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "$base/$tarball" && curl -sSfLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $tarball$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" trivy
      - run: docker build -t fp-api:scan server && docker build -t fp-web:scan client
      - run: |
          for image in fp-api:scan fp-web:scan; do
            "$RUNNER_TEMP/trivy" image --scanners vuln --ignore-unfixed --exit-code 1 "$image"
          done

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # The binary, not gitleaks-action: the action needs a paid licence on organisation repositories.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose'
