<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF5EC" />
    <title>Food Pickup</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23D13711'/%3E%3Cpath d='M20 26h24l-2 22H22z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M26 26v-4a6 6 0 0 1 12 0v4' fill='none' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!-- The very first frame is cream and readable before any stylesheet or webfont arrives (or if they never do). -->
    <style>
      html {
        background: #fbf5ec;
      }
      body {
        margin: 0;
        background: #fbf5ec;
        color: #1b1410;
        font-family:
          'Plus Jakarta Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: paint in the system font, swap in Plus Jakarta Sans once its CSS lands. -->
    <!-- main.tsx turns it into a stylesheet (no inline handler, so the CSP needs no 'unsafe-inline' for scripts). -->
    <link
      rel="preload"
      as="style"
      data-font-stylesheet
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <!-- Classic script, before the module: sets window.__RUNTIME_ENV__ (lib/runtimeEnv.ts). -->
    <script src="/runtime-env.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
